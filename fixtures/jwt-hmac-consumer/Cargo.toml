[package]
name = "jwt-hmac-profile-consumer"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
secure_identity = { path = "../../crates/secure_identity", default-features = false, features = ["jwt-hmac"] }
jsonwebtoken = { version = "11.0.0", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
