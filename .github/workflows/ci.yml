name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-admission:
    name: Dependency admission
    uses: ./.github/workflows/osv-dependency-gate.yml
    permissions:
      contents: read

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          # Exact default-secret-only hold; native guard enforces version and
          # expiry in supply-chain/maintenance-exceptions.json (2026-11-14).
          allow-ghsas: GHSA-6g2r-675j-hx59

  secret-pattern-scan:
    name: Secret Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan committed tree for high-confidence secret patterns
        shell: bash
        run: |
          set -euo pipefail
          matches="$(
            git grep -n -I -E \
              'AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|(^|[^[:alnum:]_])gh[pousr]_[A-Za-z0-9_]{36,}|github_pat_[A-Za-z0-9_]{22,}_[A-Za-z0-9_]{59,}|xox[baprs]-[A-Za-z0-9-]{10,}|(^|[^[:alnum:]_])sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|BEGIN (RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY' \
              -- . ':!Cargo.lock' || true
          )"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            exit 1
          fi

  test:
    if: always() && !cancelled()
    needs: dependency-admission
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Fail the existing required check when dependency admission fails
        if: needs.dependency-admission.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          # Windows cache saves have repeatedly failed after format, clippy,
          # tests, and docs all passed. Restore remains useful, but saving is
          # not allowed to turn a green test lane red.
          save-if: ${{ runner.os != 'Windows' }}

      - name: Native dependency trust boundaries
        run: |
          python3 scripts/check-native-dependencies.py --self-test
          python3 scripts/check-native-dependencies.py

      - name: Admit isolated HMAC consumer and all root/tool locks
        run: |
          python3 scripts/check-jwt-hmac-profile.py --self-test --output .cache/jwt-hmac-inventory-tests.json
          python3 scripts/check-jwt-hmac-profile.py --admit --output .cache/jwt-hmac-osv.json

      - name: Workflow authority regressions
        if: runner.os == 'Linux'
        run: |
          python3 scripts/check-maintenance-workflows.py
          python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Release artifact integrity regressions
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p test_prepare_release_artifacts.py

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Optional library features (Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace --all-features --locked

      - name: Reduced HMAC profile and isolated startup cases
        run: |
          cargo test -p secure_identity --no-default-features --features jwt-hmac --test jwt_hmac_profile --locked
          cargo test -p secure_identity --no-default-features --features jwt-hmac --lib jwt_hmac::tests --locked
          cargo run --manifest-path fixtures/jwt-hmac-consumer/Cargo.toml --locked -- all

      - name: Reduced HMAC Kani bounds using the existing approved toolchain
        if: runner.os == 'Linux'
        shell: bash
        env:
          KANI_HOME: ${{ github.workspace }}/.cache/kani
        run: |
          set -euo pipefail
          python3 scripts/install-security-tool.py kani-verifier --report .cache/jwt-hmac-osv.json --receipt .cache/jwt-hmac-osv.receipt.json
          bundle="$RUNNER_TEMP/kani-0.68.0-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 2 -o "$bundle" https://github.com/model-checking/kani/releases/download/kani-0.68.0/kani-0.68.0-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' 32e2b484d73ede0bbf64a2cf0879c4259422497d8aec4ee67d448de9ae7843d3 "$bundle" | sha256sum -c -
          python3 scripts/run-security-tool.py --report .cache/jwt-hmac-osv.json --receipt .cache/jwt-hmac-osv.receipt.json kani-verifier -- setup --use-local-bundle "$bundle"
          python3 scripts/lock-kani-cargo.py
          python3 scripts/check-jwt-hmac-profile.py --prove-kani --output .cache/jwt-hmac-kani.json --report .cache/jwt-hmac-osv.json --receipt .cache/jwt-hmac-osv.receipt.json

      - name: Projected workload JWT contract
        run: cargo test -p secure_identity --no-default-features --features "jwks" --test workload_jwt --locked

      - name: Projected workload JWKS fetch/cache controls
        run: cargo test -p secure_identity --no-default-features --features "jwks" --lib workload::tests --locked

      - name: Doc
        if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps --locked

      - name: Preserve HMAC admission and proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jwt-hmac-evidence-${{ matrix.os }}
          path: .cache/jwt-hmac-*
          # Only generated public inventory/proof reports, never the full cache.
          include-hidden-files: true
          if-no-files-found: error

  # sg-gate-a M4: presubmit gate enforcing Google's "preventing backsliding"
  # pattern. Every crate that gained a framework-feature matrix in M1/M2
  # is built + tested under every supported feature combination on every
  # PR, so a future edit that silently breaks one axis fails CI rather
  # than shipping.
  feature-matrix:
    if: always() && !cancelled()
    needs: dependency-admission
    name: Feature matrix (${{ matrix.crate }} features=${{ matrix.features }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [secure_boundary, secure_authz, secure_errors]
        features:
          - ""
          - "axum"
          - "actix-web"
          - "axum actix-web"
    steps:
      - name: Fail the existing required check when dependency admission fails
        if: needs.dependency-admission.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      - name: cargo test --locked
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo test --locked -p ${{ matrix.crate }} --no-default-features
          else
            cargo test --locked -p ${{ matrix.crate }} --no-default-features --features "${{ matrix.features }}"
          fi

  rustdoc-warnings:
    if: always() && !cancelled()
    needs: dependency-admission
    name: Rustdoc (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - name: Fail the existing required check when dependency admission fails
        if: needs.dependency-admission.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - name: cargo doc (deny warnings) --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features --locked

  crate-package:
    if: always() && !cancelled()
    needs: dependency-admission
    name: Crate Packaging Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Fail the existing required check when dependency admission fails
        if: needs.dependency-admission.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      - name: Package publishable crates
        shell: bash
        run: |
          set -euo pipefail
          cargo package -p security_core --locked
          for crate in \
            security_events secure_output secure_device_trust secure_network \
            secure_errors secure_boundary secure_data secure_resilience \
            secure_privacy secure_identity secure_authz
          do
            cargo package -p "$crate" --list > "/tmp/$crate.package-list" --locked
          done

  supply-chain:
    if: always() && !cancelled()
    needs: dependency-admission
    name: Supply-Chain Security
    runs-on: ubuntu-latest
    steps:
      - name: Fail the existing required check when dependency admission fails
        if: needs.dependency-admission.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      - name: Download security-tool admission evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: osv-dependencies-${{ github.workflow }}
          path: .osv-admission

      - name: Install source-verified tools with scanned frozen locks
        shell: bash
        run: |
          set -euo pipefail
          for tool in cargo-audit cargo-deny cargo-vet; do
            python3 scripts/install-security-tool.py "$tool" --report .osv-admission/osv-dependencies.json --receipt .osv-admission/osv-dependencies.receipt.json
          done

      - name: Cargo audit
        run: python3 scripts/run-security-tool.py --report .osv-admission/osv-dependencies.json --receipt .osv-admission/osv-dependencies.receipt.json cargo-audit --

      - name: Cargo deny
        run: python3 scripts/run-security-tool.py --report .osv-admission/osv-dependencies.json --receipt .osv-admission/osv-dependencies.receipt.json cargo-deny -- --locked check

      - name: Cargo vet
        run: python3 scripts/run-security-tool.py --report .osv-admission/osv-dependencies.json --receipt .osv-admission/osv-dependencies.receipt.json cargo-vet -- --locked

      # The shared dependency-admission job scans every real lockfile with OSV
      # before any matrix build. No duplicate scanner install or recursive scan.

      - name: ANSSI mapping lint
        # Gates the ANSSI Rust compliance mapping at docs/compliance/anssi-rust.md:
        # commit pin matches, rule count is exactly 61, every Status column is
        # populated, and every `compliant` row's Evidence pointer resolves to
        # a real artifact (file:line / clippy lint / docs path / test name).
        # The lint is no-op while rows remain `unfilled` (M1 placeholder) and
        # becomes gating once M2 populates evidence.
        # See docs/slo/future/RUNBOOK-anssi-rust-compliance.md M3.
        run: bash scripts/anssi-mapping-lint.sh

      - name: Lint forbidden FIPS-validated-PQ claims
        # Honest-labelling gate: SunLit does NOT claim CMVP-validated PQ
        # because no such cert exists for ML-KEM-768 as of 2026-05. This
        # gate fails the build on any regression of that posture in
        # docs/dev-guide, README, CHANGELOG, or crate sources.
        # See docs/dev-guide/secure-data.md "fips × pq interaction" and
        # docs/slo/design/pq-migration-plan.md §5.
        run: bash scripts/lint-fips-pq-claims.sh

      # cargo-geiger's latest graph still includes unpatched advisories. Do not
      # build it or waive them for an advisory-only inventory. First-party
      # unsafe attestation, native guards, SAST and bounded Kani remain enabled.
