name: TLA+

# Advisory TLA+ / TLC model-checking lane.
#
# Runs on relevant source/spec changes, weekly and manually. Failures do NOT block merges in M5
# (`continue-on-error: true`). Promotion to a blocking gate is a separate
# follow-up after >=1 release cycle of stable signal — see
# `docs/dev-guide/formal-verification.md` for the criteria.
#
# Runtime cap: 10 minutes per the research dossier
# (`docs/slo/research/formal-verification-kani-tla/synthesis.md`).
#
# Pin: tla2tools.jar version 1.8.0 (TLC 1.8.0, January 2024). Bumping
# the pin is a deliberate runbook change.
#
# Specs covered (each runs both Hardened + Naive):
# - CircuitBreaker (M4) — secure_resilience half-open single-probe rule.
# - SessionStepUp (M5) — secure_identity session+step-up lifecycle.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tla.yml"
      - "specs/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tla.yml"
      - "specs/**"
  workflow_dispatch:
  schedule:
    - cron: "29 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    name: TLC (${{ matrix.spec }} ${{ matrix.variant }} — advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Each spec ships two .cfg files: Hardened (TLC must accept)
        # and Naive (TLC must reject with the documented counterexample).
        include:
          - spec: CircuitBreaker
            variant: hardened
            cfg: CircuitBreaker.cfg
            tla: CircuitBreaker.tla
            expect: pass
          - spec: CircuitBreaker
            variant: naive
            cfg: CircuitBreakerNaive.cfg
            tla: CircuitBreakerNaive.tla
            expect: fail
          - spec: SessionStepUp
            variant: hardened
            cfg: SessionStepUp.cfg
            tla: SessionStepUp.tla
            expect: pass
          - spec: SessionStepUp
            variant: naive
            cfg: SessionStepUpNaive.cfg
            tla: SessionStepUpNaive.tla
            expect: fail
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned TLA+ Tools (TLC 1.8.0)
        shell: bash
        env:
          TLA_TOOLS_VERSION: "v1.8.0"
          TLA_TOOLS_URL: "https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar"
          # SHA-256 of tla2tools.jar at v1.8.0 — pinned per /slo-tla SKILL §3.
          # If this checksum mismatches, do NOT proceed: the upstream
          # artifact may have been replaced.
          TLA_TOOLS_SHA256: "b658b4e504fdf0b721caf7066320f6b6fe5805f4dd2f717d0e47baba4097205e"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.sldo/tla"
          curl -fL "$TLA_TOOLS_URL" -o "$HOME/.sldo/tla/tla2tools.jar.partial"
          printf '%s  %s\n' "$TLA_TOOLS_SHA256" "$HOME/.sldo/tla/tla2tools.jar.partial" | sha256sum -c -
          mv "$HOME/.sldo/tla/tla2tools.jar.partial" "$HOME/.sldo/tla/tla2tools.jar"
          ls -la "$HOME/.sldo/tla/"

      - name: Verify spec files exist
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "specs/${{ matrix.tla }}" ] || [ ! -f "specs/${{ matrix.cfg }}" ]; then
            echo "::error::Required model/spec file is missing"
            exit 1
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        id: spec-check

      - name: Run TLC on ${{ matrix.variant }} variant
        if: steps.spec-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd specs
          # TLC is run with -workers auto for parallelism. Initial run is
          # safety-only; liveness is checked separately if/when a future
          # config exercises it.
          # The expected outcome is in matrix.expect.
          set +e
          java -Xmx2g -cp "$HOME/.sldo/tla/tla2tools.jar" tlc2.TLC \
              -workers auto \
              -config "${{ matrix.cfg }}" \
              "${{ matrix.tla }}" \
              | tee tlc-output.log
          tlc_exit=$?
          set -e

          # Hardened variant: TLC must succeed (exit 0).
          # Naive variant: TLC must report a violation (exit non-zero).
          if [ "${{ matrix.expect }}" = "pass" ]; then
              if [ "$tlc_exit" -ne 0 ]; then
                  echo "::error::Hardened variant ${{ matrix.cfg }} expected to pass but TLC exited $tlc_exit"
                  exit 1
              fi
              echo "Hardened variant ${{ matrix.cfg }} passed."
          else
              if [ "$tlc_exit" -eq 0 ] || ! grep -q "Error: Invariant .* is violated" tlc-output.log; then
                  echo "::error::Naive variant ${{ matrix.cfg }} expected to FAIL (find a counterexample) but TLC exited 0 — the spec is too abstract"
                  exit 1
              fi
              echo "Naive variant ${{ matrix.cfg }} correctly reported a counterexample."
          fi
