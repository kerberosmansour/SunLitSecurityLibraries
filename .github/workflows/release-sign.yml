name: Release Artifact Signing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to package and sign, or all once internal dependencies are already published"
        required: true
        type: choice
        default: security_core
        options:
          - security_core
          - security_events
          - secure_output
          - secure_device_trust
          - secure_network
          - secure_errors
          - secure_boundary
          - secure_data
          - secure_resilience
          - secure_privacy
          - secure_identity
          - secure_authz
          - all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-sign:
    name: Package release crates (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      - name: Verify release commit and versions
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PYTHON'
          import os, pathlib, tomllib
          ref = os.environ['RELEASE_REF']
          versions = {tomllib.loads(p.read_text())['package']['version'] for p in pathlib.Path('crates').glob('*/Cargo.toml') if tomllib.loads(p.read_text())['package'].get('publish') is not False}
          assert len(versions) == 1, versions
          if ref.startswith('refs/tags/'):
              assert ref == 'refs/tags/v' + next(iter(versions)), (ref, versions)
          PYTHON
          python3 scripts/check-native-dependencies.py
      - name: Package crates
        shell: bash
        env:
          SELECTED_CRATE: ${{ github.event.inputs.crate || 'all' }}
        run: |
          set -euo pipefail
          selected="$SELECTED_CRATE"
          if [ "$selected" = "all" ]; then
            crates=(
              security_core
              security_events
              secure_output
              secure_device_trust
              secure_network
              secure_errors
              secure_boundary
              secure_data
              secure_resilience
              secure_privacy
              secure_identity
              secure_authz
            )
          else
            crates=("$selected")
          fi
          for crate in "${crates[@]}"; do
            cargo package --locked -p "$crate"
          done

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed-artifacts
          cp target/package/*.crate signed-artifacts/
          cp declarations/cyclonedx-1.6-capabilities.json signed-artifacts/
          (
            cd signed-artifacts
            mapfile -d '' files < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z)
            shasum -a 256 "${files[@]}" > SHA256SUMS
          )

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release-artifacts
          path: signed-artifacts/
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign prebuilt artifacts (isolated OIDC)
    needs: package-and-sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-release-artifacts
          path: signed-artifacts
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify manifest and sign artifacts
        env:
          WORKFLOW_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-sign.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          (cd signed-artifacts && sha256sum --check SHA256SUMS)
          for artifact in signed-artifacts/*; do
            [ -f "$artifact" ] || continue
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
            cosign verify-blob --bundle "${artifact}.sigstore.json" --certificate-identity "$WORKFLOW_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$artifact"
          done
      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-artifacts
          path: signed-artifacts/
          if-no-files-found: error
          retention-days: 30
