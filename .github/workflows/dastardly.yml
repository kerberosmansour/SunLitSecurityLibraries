# Dastardly (Burp Suite) DAST scan workflow for SunLit Security Libraries
#
# Runs Dastardly from PortSwigger against the secure_smoke_service.
# This is the CI DAST lane for pull requests and main.
# Triggered on push/PR to main, and manually via workflow_dispatch.

name: Dastardly DAST Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-admission:
    name: Dependency admission
    uses: ./.github/workflows/osv-dependency-gate.yml
    permissions:
      contents: read

  dastardly-scan:
    needs: dependency-admission
    name: Dastardly (Burp Suite) Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dastardly-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dastardly-

      - name: Build smoke service
        run: cargo build -p secure_smoke_service --locked

      - name: Start smoke service
        run: |
          cargo run -p secure_smoke_service --locked &
          echo "SMOKE_PID=$!" >> "$GITHUB_ENV"

          # Wait for service to be healthy
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health; then
              echo ""
              echo "Smoke service is healthy."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Smoke service did not start in 30 seconds."
              exit 1
            fi
            sleep 1
          done

      - name: Pull official digest-pinned Dastardly with bounded registry retries
        shell: bash
        run: |
          set -euo pipefail
          image=public.ecr.aws/portswigger/dastardly@sha256:d2a78619439e7e624d7f9b8c5da4c4015090d7140b3f09e43f0102bb77bae83f
          for attempt in $(seq 1 6); do
            if docker pull "$image"; then exit 0; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 10
          done

      - name: Run Dastardly against generated loopback fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/dastardly
          docker run --rm --network host --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/output/dastardly:/dastardly" \
            -e DASTARDLY_TARGET_URL=http://127.0.0.1:3001/dast-index \
            -e DASTARDLY_OUTPUT_FILE=/dastardly/dastardly-report.xml \
            public.ecr.aws/portswigger/dastardly@sha256:d2a78619439e7e624d7f9b8c5da4c4015090d7140b3f09e43f0102bb77bae83f

      - name: Verify Dastardly report without check-write credentials
        if: always()
        run: python3 scripts/check-dast-report.py output/dastardly/dastardly-report.xml

      - name: Upload Dastardly report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dastardly-report
          path: output/dastardly/dastardly-report.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Stop smoke service
        if: always()
        run: |
          if [ -n "${SMOKE_PID:-}" ]; then
            kill "$SMOKE_PID" 2>/dev/null || true
          fi
