name: Kani

# Advisory Kani model-checking lane.
#
# Runs on relevant source/spec changes, weekly and manually. Failures do NOT block merges in M1
# (`continue-on-error: true`). Promotion to a blocking gate is a separate
# follow-up after >=1 release cycle of stable signal — see
# `docs/dev-guide/formal-verification.md` for the criteria.
#
# Runtime cap: 15 minutes per the research dossier
# (`docs/slo/research/formal-verification-kani-tla/synthesis.md`).
#
# Pin: source-verified kani-verifier 0.68.0 with frozen scanned lock. Bumping the
# pin is a deliberate runbook change so CI behaviour is reproducible
# from the workspace's pinned version.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kani.yml"
      - "crates/**/*.rs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/kani.yml"
      - "crates/**/*.rs"
  workflow_dispatch:
  schedule:
    - cron: "13 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-admission:
    name: Dependency admission
    uses: ./.github/workflows/osv-dependency-gate.yml
    permissions:
      contents: read

  kani:
    needs: dependency-admission
    name: Kani (advisory)
    runs-on: ubuntu-latest
    # Advisory: failures surface yellow on the PR but do not block merge.
    # Promotion to blocking is a separate follow-up runbook.
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # M1 ships one bootstrap proof on `secure_data`. M2 extends to
        # `secure_authz` and `secure_boundary`; M3 extends to `secure_errors`.
        # Each new harness adds a row here; keep the matrix small so the
        # 15-min cap is per-crate, not per-proof.
        crate: [secure_data, secure_authz, secure_boundary, secure_errors]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      - name: Download Kani tool admission evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: osv-dependencies-${{ github.workflow }}
          path: .osv-admission

      - name: Install Kani with admitted frozen dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/install-security-tool.py kani-verifier --report .osv-admission/osv-dependencies.json --receipt .osv-admission/osv-dependencies.receipt.json
          bundle="$RUNNER_TEMP/kani-0.68.0-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 2 -o "$bundle" https://github.com/model-checking/kani/releases/download/kani-0.68.0/kani-0.68.0-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' 32e2b484d73ede0bbf64a2cf0879c4259422497d8aec4ee67d448de9ae7843d3 "$bundle" | sha256sum -c -
          python3 scripts/run-security-tool.py --report .osv-admission/osv-dependencies.json --receipt .osv-admission/osv-dependencies.receipt.json kani-verifier -- setup --use-local-bundle "$bundle"

      - name: Run Kani proofs
        shell: bash
        run: |
          set -euo pipefail
          echo "--- Kani version ---"
          python3 scripts/run-security-tool.py --report .osv-admission/osv-dependencies.json --receipt .osv-admission/osv-dependencies.receipt.json kani-verifier -- --version
          echo "--- harnesses for ${{ matrix.crate }} ---"
          # Assertion reachability can report these small invariant harnesses
          # as unreachable on the pinned verifier/toolchain combination.
          python3 scripts/run-security-tool.py --report .osv-admission/osv-dependencies.json --receipt .osv-admission/osv-dependencies.receipt.json kani-verifier -- -p "${{ matrix.crate }}" --output-format old --no-assertion-reach-checks --locked

      - name: Surface result regardless of pass/fail
        if: always()
        shell: bash
        run: |
          # Always print the per-harness summary, even on failure, so
          # reviewers can see which proof regressed without re-running.
          if [ -d "target/kani" ]; then
            echo "--- target/kani contents ---"
            ls -la target/kani || true
          fi
