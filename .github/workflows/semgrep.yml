name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-admission:
    name: Dependency admission
    uses: ./.github/workflows/osv-dependency-gate.yml
    permissions:
      contents: read

  rust:
    needs: dependency-admission
    name: Semgrep Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the admitted Semgrep wheel ABI
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'

      - name: Install Semgrep
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          . "$RUNNER_TEMP/semgrep-venv/bin/activate"
          python -m pip install --disable-pip-version-check --no-input --require-hashes --no-deps --only-binary=:all: -r tools/security-toolchains/semgrep/requirements.txt

      - name: Semgrep Rust scan
        shell: bash
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/semgrep-venv/bin/activate"
          semgrep scan \
            --config p/rust \
            --config p/owasp-top-ten \
            --metrics=off \
            --error \
            --sarif \
            --output semgrep.sarif \
            --exclude .cache \
            --exclude target \
            --exclude .git \
            .

      - uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        if: ${{ github.event.repository.private == false && github.event_name != 'pull_request' && always() && hashFiles('semgrep.sarif') != '' }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep-rust
