[package]
name = "secure_identity"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Authentication helpers for JWT, OIDC, MFA, API keys, sessions, and step-up policy."
readme = "README.md"
repository = "https://github.com/kerberosmansour/SunLitSecurityLibraries"
documentation = "https://docs.rs/secure_identity"
keywords = ["security", "identity", "jwt", "oidc", "mfa"]

categories = ["cryptography", "authentication"]

[lib]
name = "secure_identity"

[features]
default = ["asymmetric-jwt", "ssh-public-keys"]
jwt-hmac = []
asymmetric-jwt = ["jsonwebtoken/rust_crypto", "jsonwebtoken/use_pem"]
ssh-public-keys = ["dep:rsa", "dep:ed25519-dalek", "dep:p256", "dep:p384", "dep:p521"]
dev = []
biometric = []
jwks = ["asymmetric-jwt", "dep:reqwest"]
oidc = ["asymmetric-jwt", "dep:openidconnect", "dep:reqwest"]
session-redis = ["dep:redis", "dep:xxhash-rust"]

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "=2.2.0", default-features = false, optional = true }
jsonwebtoken = { version = "11.0.0", default-features = false }
p256 = { version = "=0.13.2", default-features = false, features = ["arithmetic"], optional = true }
p384 = { version = "=0.13.1", default-features = false, features = ["arithmetic"], optional = true }
p521 = { version = "=0.13.3", default-features = false, features = ["arithmetic"], optional = true }
rsa = { version = "=0.9.10", default-features = false, features = ["std", "u64_digit"], optional = true }
tokio = { version = "1", features = ["sync", "time", "net", "io-util"] }
ring = "0.17"
subtle = "2"
uuid = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tracing = "0.1"
url = "2"
totp-rs = { version = "5", features = ["otpauth"] }
openidconnect = { version = "4", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
redis = { version = "1", features = ["aio", "tokio-comp"], optional = true }
# Constrain Redis's existing transitive hash dependency while generic
# custom-secret APIs in later versions remain under memory-safety review.
xxhash-rust = { version = "=0.8.16", default-features = false, optional = true }
security_core = { workspace = true }
security_events = { workspace = true }
secure_errors = { workspace = true }
secure_device_trust = { workspace = true }
secure_network = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
jsonwebtoken = { version = "11.0.0", default-features = false }
uuid = { workspace = true }
serde = { workspace = true }
security_core = { workspace = true }
time = { workspace = true }
proptest = "1"
ring = "0.17"
base64 = "0.22"
untrusted = "0.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
